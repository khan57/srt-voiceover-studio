[pytest]
testpaths = tests
addopts = -q --strict-markers -m "not network"
markers =
    network: hits the live Edge-TTS service; deselected by default.
filterwarnings =
    # pydub imports the deprecated stdlib `audioop` module. On Python 3.13+
    # `audioop-lts` supplies it instead; either way the warning is not ours.
    ignore:'audioop' is deprecated:DeprecationWarning
